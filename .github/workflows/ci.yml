# F01 -- internal engineering CI.
#
# This is the *internal* CI the Stage Implementation Plan requires ("Internal
# engineering CI is required and is distinct from the deferred product
# integration feature"). It is not the product's CI/CD enforcement hook, which
# is explicitly deferred from the MVP.
#
# F01's acceptance evidence is "Fresh environment reproduces the build and
# tests; no committed credentials; network boundaries documented". The matrix
# below is the fresh-environment half; `boundary` is the network-boundary half.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Spec Section 12 names Python 3.10 as the floor. The newest version is
        # included so a deprecation is caught here rather than later.
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Format check
        run: python -m ruff format --check src tests

      - name: Test
        run: python -m pytest -q

  boundary:
    name: purity boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Run the boundary tests on their own so a failure here is unmistakable:
      # it means the decision core has grown a way to reach the network, a
      # database, the filesystem, a subprocess or the wall clock.
      - name: Assert the core stays pure
        run: python -m pytest tests/test_boundary.py -v

      # The core declares no runtime dependencies, so installing it with none
      # available must still work. This catches an accidental import before it
      # reaches a reviewer.
      - name: Import with no dependencies installed
        run: |
          python -m venv /tmp/bare
          /tmp/bare/bin/python -m pip install --quiet .
          /tmp/bare/bin/python -c "import seal.core; print('core imports with zero dependencies')"

  secrets:
    name: no committed credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A basic guard, not a credential scanner. It catches the obvious case --
      # a key or password literal committed by accident -- and asserts the
      # .gitignore entries that keep evidence and key material out of the repo.
      # A real secret-scanning control belongs to F01's reviewed tooling
      # decision under D05, not to this file.
      - name: Scan for obvious credential literals
        run: |
          if git grep -nIE '(BEGIN (RSA|EC|OPENSSH|PGP) PRIVATE KEY|AKIA[0-9A-Z]{16})'                -- . ':!.github/workflows/ci.yml'; then
            echo "::error::a credential literal appears to be committed"
            exit 1
          fi
          echo "no credential literals found"

      - name: Assert the ignore rules that keep evidence out of the repo
        run: |
          for rule in '.env' '*.key' '*.pem' 'evidence/'; do
            grep -qxF "$rule" .gitignore || {
              echo "::error::.gitignore is missing the rule: $rule"
              exit 1
            }
          done
          echo "ignore rules present"
